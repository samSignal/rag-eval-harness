[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "1.0.0"
description = "Evaluation and regression testing for RAG systems: retrieval, citations, faithfulness, key facts, refusals, latency and cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "legal-hybrid-search @ git+https://github.com/samSignal/legal-hybrid-search.git",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
rageval = "rageval.cli:main"

[tool.setuptools]
packages = ["rageval"]
